version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: harness-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - harness-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harness-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - CONNECTION_STRING=Data Source=/app/data/secure_harness.db
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - harness-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harness-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - harness-network

volumes:
  ollama_models:
  sqlite_data:

networks:
  harness-network:
    driver: bridge
